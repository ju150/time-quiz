<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time Management Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --leaf:#e7f7dc; --leaf2:#c6ecb0; --forest:#14361f; --moss:#4e8439; --pine:#256761; --teal:#00a99f;
  --paper:#fbfff7; --muted:#4d6b55;
  --study:#2f6fdb; --fun:#f0b400; --rest:#8a57d6; --deadline:#e2463f;
  --ok:#1f9d55; --bad:#d23b35;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--forest);
  background:linear-gradient(140deg,var(--leaf) 0%,var(--leaf2) 100%);min-height:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.f{font-family:Fredoka,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.hidden{display:none!important}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- day strip: the countdown, built from the game's 12 boxes ---------- */
.day{display:grid;grid-template-columns:repeat(12,1fr);gap:.5vw;width:100%}
.day .box{aspect-ratio:1.5/1;border-radius:.6vw;background:var(--forest);transition:background .35s,transform .35s}
.day .box.off{background:rgba(20,54,31,.12);transform:scale(.9)}
.day .box:nth-child(n+5){background:var(--pine)} .day .box:nth-child(n+9){background:var(--moss)}
.day .box.off:nth-child(n){background:rgba(20,54,31,.12)}
.daylab{display:grid;grid-template-columns:repeat(3,1fr);font-size:1.1vw;color:var(--muted);margin-top:.4vw}
.daylab span{padding-left:.2vw}

/* ---------- projected screen ---------- */
.screen{padding:3vw 4vw;gap:2vw}
.screen .top{display:flex;justify-content:space-between;align-items:center;font-size:1.4vw;color:var(--muted)}
.screen .top b{color:var(--forest)}
.lobby{flex:1;display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center}
.qrwrap{background:var(--paper);padding:1.6vw;border-radius:1.6vw;box-shadow:0 1vw 0 var(--forest)}
.qrwrap #qr img,.qrwrap #qr canvas{width:22vw!important;height:22vw!important;display:block}
.qrwrap .url{font-size:1.15vw;text-align:center;margin-top:.8vw;word-break:break-all;max-width:22vw}
.lobby h1{font-size:5.4vw;line-height:1}
.lobby p{font-size:1.8vw;margin:1.2vw 0 2vw;color:var(--muted);max-width:38ch}
.names{display:flex;flex-wrap:wrap;gap:.8vw}
.name{font-family:Fredoka;font-weight:600;font-size:1.6vw;background:var(--paper);padding:.5vw 1.2vw;border-radius:99px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.count{font-family:Fredoka;font-size:2vw;margin-bottom:1vw}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

.qview{flex:1;display:flex;flex-direction:column;gap:2vw}
.qhead{display:flex;align-items:flex-start;gap:3vw}
.qnum{font-family:Fredoka;font-size:1.6vw;color:var(--muted);white-space:nowrap;padding-top:1vw}
.qtext{font-size:3.6vw;line-height:1.12;flex:1}
.timer{font-family:Fredoka;font-size:5vw;line-height:1;min-width:6vw;text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;flex:1}
.tile{border-radius:1.4vw;color:#fff;padding:1.6vw 2vw;display:flex;align-items:center;gap:1.4vw;font-size:2.2vw;line-height:1.15;position:relative;overflow:hidden;transition:opacity .4s,transform .4s}
.tile .ic{font-size:3vw}
.tile .bar{position:absolute;left:0;bottom:0;height:.9vw;background:rgba(255,255,255,.75);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tile .n{margin-left:auto;font-family:Fredoka;font-size:2.8vw;opacity:0;transition:opacity .4s}
.reveal .tile .n{opacity:1}
.reveal .tile.wrong{opacity:.28;transform:scale(.97)}
.reveal .tile.right{box-shadow:0 0 0 .5vw var(--forest);transform:scale(1.02)}
.c0{background:var(--study)}.c1{background:var(--fun);color:var(--forest)}.c2{background:var(--rest)}.c3{background:var(--deadline)}
.c1 .bar{background:rgba(20,54,31,.5)}
.foot{display:flex;justify-content:space-between;align-items:end;gap:3vw;font-size:1.6vw}
.explain{font-size:2.1vw;max-width:60ch}
.mini{display:flex;gap:1vw;flex-wrap:wrap}
.mini div{background:var(--paper);border-radius:99px;padding:.4vw 1vw;font-family:Fredoka}

.podium{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:2vw}
.podium h1{font-size:4.6vw}
.steps{display:grid;grid-template-columns:repeat(3,22vw);align-items:end;gap:1.5vw}
.step{display:flex;flex-direction:column;align-items:center;gap:.8vw}
.step .who{font-family:Fredoka;font-weight:700;font-size:2.4vw;text-align:center;opacity:0;transform:translateY(1vw);transition:all .5s}
.step .pts{font-size:1.4vw;color:var(--muted)}
.step .blk{width:100%;border-radius:1.2vw 1.2vw 0 0;display:flex;justify-content:center;padding-top:1vw;font-family:Fredoka;font-size:5vw;color:#fff;height:0;transition:height 1.1s cubic-bezier(.2,.9,.2,1)}
.step.p1 .blk{background:var(--fun);color:var(--forest)} .step.p2 .blk{background:var(--study)} .step.p3 .blk{background:var(--rest)}
.step.up .who{opacity:1;transform:none}
.step.p1.up .blk{height:24vw}.step.p2.up .blk{height:17vw}.step.p3.up .blk{height:12vw}
.rest4{display:flex;gap:1vw;font-size:1.5vw}
#confetti{position:fixed;inset:0;pointer-events:none}

/* ---------- player phone ---------- */
.player{padding:20px 16px calc(20px + env(safe-area-inset-bottom));gap:16px}
.ptop{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.ptop b{color:var(--forest)}
.card{background:var(--paper);border-radius:22px;padding:24px 20px}
.join h1{font-size:34px;line-height:1.05;margin-bottom:8px}
.join p{color:var(--muted);margin-bottom:20px;font-size:17px}
.join input{width:100%;font:inherit;font-size:22px;padding:14px 16px;border-radius:14px;border:3px solid var(--forest);background:#fff;color:var(--forest)}
.big{width:100%;margin-top:14px;font-family:Fredoka;font-weight:600;font-size:22px;padding:16px;border-radius:16px;background:var(--forest);color:#fff;box-shadow:0 6px 0 var(--moss)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--moss)}
.big:disabled{opacity:.45}
.wait{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
.wait .em{font-size:64px}
.wait h2{font-size:30px}
.wait p{font-size:18px;color:var(--muted);max-width:26ch}
.pq{font-size:19px;line-height:1.3;font-weight:700}
.ptimer{font-family:Fredoka;font-size:20px}
.btns{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{border-radius:20px;color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;text-align:left;font-size:17px;line-height:1.2;min-height:130px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.ans .ic{font-size:34px}
.ans:active{transform:scale(.97)}
.ans.c1{color:var(--forest)}
.result{flex:1;border-radius:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;gap:10px;padding:24px}
.result.good{background:var(--ok)}.result.bad{background:var(--bad)}.result.none{background:var(--pine)}
.result h2{font-size:40px}
.result .gain{font-family:Fredoka;font-size:56px}
.result p{font-size:19px;max-width:30ch}
.result .big{max-width:320px;background:#fbfff7;color:var(--forest);box-shadow:0 6px 0 rgba(0,0,0,.2)}

/* ---------- remote / prompter ---------- */
.remote{padding:14px 14px calc(14px + env(safe-area-inset-bottom));gap:12px;background:var(--forest);color:#eaf7e1}
.rtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#a8c9b0}
.rtop b{color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.1);border-radius:99px;padding:6px 12px;font-size:15px}
.chip b{color:#fff}
.cue{font-size:15px;color:#ffd75e;line-height:1.35}
.say{flex:1;overflow:auto;background:#fbfff7;color:var(--forest);border-radius:20px;padding:22px 20px;font-size:23px;line-height:1.45}
.say .lab{font-size:13px;color:var(--muted);margin-bottom:8px}
.say .ansline{margin-top:14px;padding-top:12px;border-top:2px dashed var(--leaf2);font-size:17px;color:var(--pine)}
.next{font-size:14px;color:#a8c9b0}
.next b{color:#fff;font-weight:400}
.go{width:100%;font-family:Fredoka;font-weight:600;font-size:24px;padding:18px;border-radius:18px;background:var(--fun);color:var(--forest);box-shadow:0 6px 0 #b08400}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b08400}
.rrow{display:flex;gap:8px}
.ghost{flex:1;background:rgba(255,255,255,.1);color:#eaf7e1;border-radius:12px;padding:10px;font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e2463f;margin-right:6px}
.dot.on{background:#5ee08a}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root" class="app"></div>
<canvas id="confetti"></canvas>
<script>
"use strict";
/* ================= config ================= */
const FB = { databaseURL: "https://time-quiz-group08-default-rtdb.asia-southeast1.firebasedatabase.app" };
const GAME = "g1";
const DUR = 20; // seconds per question
const REMOTE_KEY = "tm08";
const ICONS = ["📚","😃","💤","📝"];
const QUESTIONS = [
  { q:"In the game, why was it smart to leave some boxes empty?",
    a:["To score more base points","Empty boxes give bonus points","To have room for unexpected events","It doesn't matter"], c:2,
    say:"Yes: empty boxes give you room for unexpected events." },
  { q:"Your day is full and a deadline suddenly arrives. What is the best move?",
    a:["Drop a less important task to make room","Ignore the deadline","Do everything at the same time","Give up on the whole plan"], c:0,
    say:"Right: when your day is full, you drop the less important task." },
  { q:"In the Eisenhower Matrix, studying for an exam in 3 weeks is…",
    a:["Urgent and important: do it right now","Not important: delete it","Urgent but not important: delegate it","Important but not urgent: schedule it"], c:3,
    say:"Exactly: important but not urgent, so you schedule it early." },
  { q:"Why did a Rest block right after a Study block give bonus points?",
    a:["Resting is better than studying","Breaks after focused work keep you productive","Rest should always be in the evening","Rest can replace studying"], c:1,
    say:"Yes: a short break after focused work keeps you productive." },
  { q:"Which strategy is the right one to arrange your day?",
    a:["Always do the important tasks first","Always follow your energy level","Both can work, if you know why you chose it","Always start with the easiest tasks"], c:2,
    say:"And the trick question: both strategies can work, as long as you know why you chose yours." }
];

/* ================= firebase ================= */
firebase.initializeApp(FB);
const db = firebase.database();
const G = db.ref("games/" + GAME);
let offset = 0;
db.ref(".info/serverTimeOffset").on("value", s => offset = s.val() || 0);
const now = () => Date.now() + offset;
let connected = false;
db.ref(".info/connected").on("value", s => { connected = !!s.val(); onConn(); });
let onConn = () => {};

let S = { phase:"lobby", q:-1 }, P = {}, A = {};
const listeners = [];
G.child("state").on("value", s => { S = s.val() || { phase:"lobby", q:-1 }; refresh(); });
G.child("players").on("value", s => { P = s.val() || {}; refresh(); });
G.child("answers").on("value", s => { A = s.val() || {}; refresh(); });
function refresh(){ listeners.forEach(f => f()); }

const answersFor = q => A[q] ? Object.entries(A[q]) : [];
const ranking = () => Object.entries(P).map(([id,p]) => ({ id, name:p.name, score:p.score||0 })).sort((a,b) => b.score - a.score);
const remaining = () => S.phase === "question" && S.startedAt ? Math.max(0, DUR - (now() - S.startedAt)/1000) : 0;

/* ================= game actions (screen + remote) ================= */
async function startQuestion(q){
  await G.child("state").set({ phase:"question", q, startedAt: firebase.database.ServerValue.TIMESTAMP });
}
async function reveal(){
  const q = S.q;
  const res = await G.child("state").transaction(s => (s && s.phase === "question" && s.q === q) ? { ...s, phase:"reveal" } : undefined);
  if (!res.committed) return;
  const st = res.snapshot.val();
  const ans = (await G.child("answers/" + q).get()).val() || {};
  const players = (await G.child("players").get()).val() || {};
  const up = {};
  for (const [id, p] of Object.entries(players)) {
    const a = ans[id];
    let gained = 0, correct = false;
    if (a && a.c === QUESTIONS[q].c) {
      correct = true;
      const el = Math.min(1, Math.max(0, (a.t - st.startedAt) / (DUR*1000)));
      gained = Math.round(1000 - 500*el);
    }
    up["players/" + id + "/score"] = (p.score||0) + gained;
    up["players/" + id + "/last"] = { q, gained, correct, answered: !!a };
  }
  await G.update(up);
}
async function next(){
  if (S.phase === "lobby") return startQuestion(0);
  if (S.phase === "question") return reveal();
  if (S.phase === "reveal") return S.q < QUESTIONS.length-1 ? startQuestion(S.q+1) : G.child("state").set({ phase:"podium", q:S.q });
}
async function resetGame(){ await G.set({ state:{ phase:"lobby", q:-1 } }); }

// auto reveal when time is up or everybody answered (both screen & remote watch; transaction keeps it single)
function autoReveal(){
  if (S.phase !== "question" || !S.startedAt) return;
  const n = Object.keys(P).length, got = answersFor(S.q).length;
  if (remaining() <= 0 || (n > 0 && got >= n)) reveal();
}

/* ================= helpers ================= */
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const root = document.getElementById("root");
const params = new URLSearchParams(location.search);
const baseURL = location.origin + location.pathname;
const ordinal = n => { const t = n % 100, u = n % 10; return n + ((t >= 11 && t <= 13) ? "th" : u === 1 ? "st" : u === 2 ? "nd" : u === 3 ? "rd" : "th"); };
function dayStrip(){ return '<div><div class="day">' + Array.from({length:12},()=>'<div class="box"></div>').join("") + '</div><div class="daylab"><span>Morning</span><span>Afternoon</span><span>Evening</span></div></div>'; }
function paintDay(el, rem){ if(!el) return; const on = Math.ceil(rem / DUR * 12); el.querySelectorAll(".box").forEach((b,i) => b.classList.toggle("off", i >= on)); }

/* ================= confetti ================= */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#2f6fdb","#f0b400","#8a57d6","#e2463f","#00a99f","#14361f"];
  const ps = Array.from({length:180}, () => ({ x:Math.random()*c.width, y:-20-Math.random()*c.height*.6, w:8+Math.random()*10, h:12+Math.random()*12, vy:2+Math.random()*4, vx:-1.5+Math.random()*3, r:Math.random()*6, vr:-.1+Math.random()*.2, col:cols[Math.random()*6|0] }));
  let t = 0;
  (function f(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p => { p.y+=p.vy; p.x+=p.vx; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); }); if (++t < 420) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

/* ================= SCREEN (projector) ================= */
function screenMode(){
  root.className = "app screen";
  let shown = "", qrDone = false, podiumDone = false;
  function render(){
    const key = S.phase + ":" + S.q;
    const n = Object.keys(P).length;
    if (S.phase === "lobby") {
      if (shown !== key) {
        root.innerHTML = `<div class="top"><span><b>Time Management</b> · Group 08</span><span id="conn"></span></div>
        <div class="lobby"><div class="qrwrap"><div id="qr"></div><div class="url f">${esc(baseURL.replace(/^https?:\/\//,""))}</div></div>
        <div><h1>Plan your answers.</h1><p>Scan the code with your phone and type a nickname. Five questions, twenty seconds each, and faster answers score more.</p>
        <div class="count" id="count"></div><div class="names" id="names"></div></div></div>`;
        new QRCode(document.getElementById("qr"), { text: baseURL, width: 512, height: 512, colorDark:"#14361f", colorLight:"#fbfff7" });
        shown = key; podiumDone = false;
      }
      document.getElementById("count").textContent = n === 0 ? "Waiting for players…" : n + (n === 1 ? " player is in" : " players are in");
      const box = document.getElementById("names"), have = new Set([...box.children].map(e => e.dataset.id));
      Object.entries(P).forEach(([id,p]) => { if (!have.has(id)) { const e = $('<div class="name"></div>'); e.dataset.id = id; e.textContent = p.name; box.appendChild(e); } });
      [...box.children].forEach(e => { if (!P[e.dataset.id]) e.remove(); });
    }
    else if (S.phase === "question" || S.phase === "reveal") {
      const Q = QUESTIONS[S.q];
      if (shown !== "q:" + S.q) {
        root.innerHTML = `<div class="top"><span><b>Question ${S.q+1}</b> of ${QUESTIONS.length}</span><span id="ansc"></span></div>
        <div class="qview" id="qv"><div class="qhead"><h2 class="qtext"></h2><div class="timer" id="tm"></div></div>
        <div id="day"></div>
        <div class="tiles">${Q.a.map((a,i)=>`<div class="tile c${i}"><span class="ic">${ICONS[i]}</span><span class="t"></span><span class="n" id="n${i}">0</span><div class="bar" id="b${i}"></div></div>`).join("")}</div>
        <div class="foot"><div class="explain" id="ex"></div><div class="mini" id="mini"></div></div></div>`;
        root.querySelector(".qtext").textContent = Q.q;
        root.querySelectorAll(".tile .t").forEach((e,i) => e.textContent = Q.a[i]);
        document.getElementById("day").innerHTML = dayStrip();
        shown = "q:" + S.q;
      }
      const qv = document.getElementById("qv"), got = answersFor(S.q);
      document.getElementById("ansc").textContent = got.length + " / " + n + " answered";
      if (S.phase === "reveal") {
        qv.classList.add("reveal");
        const counts = [0,0,0,0]; got.forEach(([,a]) => counts[a.c]++);
        const max = Math.max(1, ...counts);
        Q.a.forEach((_,i) => { const t = qv.querySelectorAll(".tile")[i]; t.classList.toggle("right", i===Q.c); t.classList.toggle("wrong", i!==Q.c);
          document.getElementById("n"+i).textContent = counts[i]; document.getElementById("b"+i).style.width = (counts[i]/max*100) + "%"; });
        document.getElementById("tm").textContent = "";
        paintDay(document.getElementById("day"), 0);
        document.getElementById("ex").textContent = Q.say;
        document.getElementById("mini").innerHTML = ranking().slice(0,5).map((r,i)=>`<div>${i+1}. ${esc(r.name)} · ${r.score}</div>`).join("");
      }
    }
    else if (S.phase === "podium") {
      if (shown !== "podium") {
        const r = ranking(), slot = i => r[i] ? `<span>${esc(r[i].name)}</span>` : "<span>—</span>", pts = i => r[i] ? r[i].score + " pts" : "";
        root.innerHTML = `<div class="top"><span><b>Time Management</b> · Group 08</span><span></span></div>
        <div class="podium"><h1>Best planners of the day</h1>
        <div class="steps">
          <div class="step p2"><div class="who">${slot(1)}</div><div class="pts">${pts(1)}</div><div class="blk">2</div></div>
          <div class="step p1"><div class="who">${slot(0)}</div><div class="pts">${pts(0)}</div><div class="blk">1</div></div>
          <div class="step p3"><div class="who">${slot(2)}</div><div class="pts">${pts(2)}</div><div class="blk">3</div></div>
        </div>
        <div class="rest4">${r.slice(3,8).map((x,i)=>`<span>${i+4}. ${esc(x.name)}</span>`).join("")}</div></div>`;
        shown = "podium";
        if (!podiumDone) { podiumDone = true;
          setTimeout(() => root.querySelector(".p3").classList.add("up"), 400);
          setTimeout(() => root.querySelector(".p2").classList.add("up"), 1600);
          setTimeout(() => { root.querySelector(".p1").classList.add("up"); confetti(); }, 3000);
        }
      }
    }
  }
  listeners.push(render); render();
  setInterval(() => {
    if (S.phase === "question") { const r = remaining(); const tm = document.getElementById("tm"); if (tm) tm.textContent = Math.ceil(r); paintDay(document.getElementById("day"), r); autoReveal(); }
  }, 200);
  addEventListener("keydown", e => { if (e.key === "n" || e.key === "ArrowRight") next(); if (e.key === "R" && confirm("Reset the game? All players and scores are deleted.")) resetGame(); });
}

/* ================= PLAYER (phone) ================= */
function playerMode(){
  root.className = "app player";
  let pid = null; try { pid = localStorage.getItem("tmq-pid"); } catch(e){}
  if (!pid) { pid = Math.random().toString(36).slice(2,10); try { localStorage.setItem("tmq-pid", pid); } catch(e){} }
  let shown = "", picked = null;
  function render(){
    const me = P[pid];
    if (!me) {
      if (shown === "join") return;
      shown = "join";
      root.innerHTML = `<div class="ptop"><span><b>Time Management</b></span><span>Group 08</span></div>
      <div class="card join"><h1>Join the quiz</h1><p>Pick a nickname. It shows on the big screen.</p>
      <input id="nm" maxlength="16" autocomplete="off" placeholder="Your nickname" aria-label="Your nickname">
      <button class="big" id="jb">Join</button></div>`;
      const nm = document.getElementById("nm"), jb = document.getElementById("jb");
      const go = async () => { const v = nm.value.trim().slice(0,16); if (!v) { nm.focus(); return; } jb.disabled = true; jb.textContent = "Joining…";
        try { await G.child("players/" + pid).set({ name:v, score:0 }); } catch(e) { jb.disabled = false; jb.textContent = "No connection, tap to retry"; } };
      jb.onclick = go; nm.onkeydown = e => { if (e.key === "Enter") go(); };
      return;
    }
    const top = `<div class="ptop"><span><b>${esc(me.name)}</b></span><span>${me.score||0} pts</span></div>`;
    if (S.phase === "lobby") {
      if (shown === "lobby") return; shown = "lobby";
      root.innerHTML = top + `<div class="wait"><div class="em">📅</div><h2>You're in!</h2><p>Look at the big screen. The first question is coming.</p></div>`;
    } else if (S.phase === "question") {
      const mine = A[S.q] && A[S.q][pid];
      if (mine) {
        if (shown === "locked:" + S.q) return; shown = "locked:" + S.q;
        root.innerHTML = top + `<div class="wait"><div class="em">${ICONS[mine.c]}</div><h2>Answer locked</h2><p>Wait for the others… eyes on the screen.</p></div>`;
        return;
      }
      if (shown === "q:" + S.q) return; shown = "q:" + S.q; picked = null;
      const Q = QUESTIONS[S.q];
      root.innerHTML = top + `<div class="card"><div class="ptimer" id="pt">Question ${S.q+1}</div><div class="pq"></div></div>
      <div class="btns">${Q.a.map((a,i)=>`<button class="ans c${i}" data-i="${i}"><span class="ic">${ICONS[i]}</span><span class="t"></span></button>`).join("")}</div>`;
      root.querySelector(".pq").textContent = Q.q;
      root.querySelectorAll(".ans").forEach((b,i) => { b.querySelector(".t").textContent = Q.a[i];
        b.onclick = () => { if (picked !== null || remaining() <= 0) return; picked = i; if (navigator.vibrate) navigator.vibrate(40);
          G.child("answers/" + S.q + "/" + pid).set({ c:i, t: firebase.database.ServerValue.TIMESTAMP }); }; });
    } else if (S.phase === "reveal") {
      const last = me.last && me.last.q === S.q ? me.last : null;
      const key = "rev:" + S.q + ":" + (last ? 1 : 0);
      if (shown === key) return; shown = key;
      if (!last) { root.innerHTML = top + `<div class="wait"><div class="em">⏳</div><h2>Counting points…</h2></div>`; return; }
      const rank = ranking().findIndex(r => r.id === pid) + 1;
      const cls = !last.answered ? "none" : last.correct ? "good" : "bad";
      const title = !last.answered ? "Too late!" : last.correct ? "Correct!" : "Not this time";
      root.innerHTML = top + `<div class="result ${cls}"><h2>${title}</h2><div class="gain">+${last.gained}</div><p>You are ${ordinal(rank)} out of ${Object.keys(P).length}</p></div>`;
      if (last.correct && navigator.vibrate) navigator.vibrate([60,40,60]);
    } else if (S.phase === "podium") {
      if (shown === "pod") return; shown = "pod";
      const rank = ranking().findIndex(r => r.id === pid) + 1;
      root.innerHTML = top + `<div class="wait"><div class="em">${rank===1?"🏆":rank<=3?"🎉":"👏"}</div><h2>You finished ${ordinal(rank)}</h2><p>${me.score||0} points. Thanks for playing!</p></div>`;
    }
  }
  listeners.push(render); render();
  setInterval(() => { const el = document.getElementById("pt"); if (el && S.phase === "question") el.textContent = "Question " + (S.q+1) + " · " + Math.ceil(remaining()) + "s"; }, 250);
}

/* ================= REMOTE + PROMPTER (Julien's phone) ================= */
const INTRO = [
  { lab:"Slide 18 · 1 day, 4 plot twists", cue:"After the Takeaway slide, take the floor.",
    say:"Thank you! So, let's sum up what we did today. We started with a very simple plan: four study blocks and two fun blocks. Easy, right? But then real life happened, four times: you got sick, a deadline appeared, your family came to visit, and there was a surprise test. And that is exactly what time management is about: not only making a plan, but dealing with what you didn't plan." },
  { lab:"Slide 19 · 3 rules to keep", cue:"Point at each yellow block as you say it.",
    say:"From this game, we can keep three simple rules. One: leave space. The players who left some boxes empty didn't have to erase anything when the surprises came. Two: prioritize. When there is no room left, keep what matters and drop the rest. Erasing a block cost you one point, but keeping the deadline gave you three. Three: adapt. A plan is a tool, not a contract. When life changes, you rearrange it, you don't give up." },
  { lab:"Slide 20 · Eisenhower Matrix", cue:"Slow down here, point at each square.",
    say:"In real life, this is called the Eisenhower Matrix. Urgent and important, like the deadline in the game: you do it first. Important but not urgent, like studying or resting: you schedule it, before it becomes urgent. Urgent but not important, like notifications: you limit it. And not urgent, not important, like endless scrolling: you drop it. And yes, rest is important too: in the game, a break after studying gave you points." },
  { lab:"Slide 21 · Plot twist #5", cue:"CLICK the title or the bottom box on the slide: it opens the live quiz screen. Then say:",
    say:"Surprise! Here is plot twist number five: a quiz! Take your phone, scan the QR code on the screen and type a nickname. Five questions, and the faster you answer, the more points you get." }
];
function remoteMode(){
  root.className = "app remote";
  let step = 0; try { step = +localStorage.getItem("tmq-step") || 0; } catch(e){}
  const setStep = v => { step = v; try { localStorage.setItem("tmq-step", v); } catch(e){} render(); };
  root.innerHTML = `<div class="rtop"><span><span class="dot" id="dot"></span><b>Prompter</b> · remote</span><span id="phase"></span></div>
  <div class="chips" id="chips"></div><div class="cue" id="cue"></div>
  <div class="say" id="say"></div><div class="next" id="nx"></div>
  <button class="go" id="go"></button>
  <div class="rrow"><button class="ghost" id="back">Back</button><button class="ghost" id="rst">Reset quiz</button></div>`;
  const $id = id => document.getElementById(id);
  onConn = () => { $id("dot").classList.toggle("on", connected); };
  onConn();
  function view(){
    const n = Object.keys(P).length;
    if (step < INTRO.length && S.phase === "lobby") {
      const it = INTRO[step];
      return { phase:"Summary " + (step+1) + "/4", lab:it.lab, cue:it.cue, say:it.say,
        next: step < 3 ? "Next: " + INTRO[step+1].lab : "Next: wait for players, then start question 1",
        go: step < 3 ? "Next slide" : "Players are joining →", act: () => setStep(step+1) };
    }
    if (S.phase === "lobby") return { phase:"Lobby", lab:"Waiting room", cue: n + " player(s) connected. Start when most of the class is in.",
      say:"Ready? Here comes question one!", next:"Next: question 1", go:"Start question 1", act: next };
    if (S.phase === "question") { const Q = QUESTIONS[S.q];
      return { phase:"Question " + (S.q+1) + "/5", lab:"Read it out loud", cue: Math.ceil(remaining()) + "s left · " + answersFor(S.q).length + "/" + n + " answered",
        say:"Question " + ["one","two","three","four","five"][S.q] + "! " + Q.q, ans:"Answer: " + ICONS[Q.c] + " " + Q.a[Q.c],
        next:"Reveals by itself at 0s or when everyone has answered", go:"Reveal now", act: next }; }
    if (S.phase === "reveal") { const Q = QUESTIONS[S.q], last = S.q === QUESTIONS.length-1, top = ranking()[0];
      return { phase:"Answer " + (S.q+1) + "/5", lab:"Explain in one sentence", cue: top ? "Leader: " + top.name + " (" + top.score + " pts)" : "",
        say:Q.say, next: last ? "Next: the podium" : "Next: question " + (S.q+2), go: last ? "Show the podium" : "Next question", act: next }; }
    if (S.phase === "podium") return { phase:"Podium", lab:"Wait for the 1st place, then say", cue:"The podium rises 3rd → 2nd → 1st (with confetti).",
      say:"Congratulations to our winners! Thank you all for playing, and I hope you'll leave some empty boxes in your own schedule this week.",
      next:"Then: switch back to the slides, Thank you slide", go:"Done ✓", act: () => {} };
  }
  function render(){
    const v = view(); if (!v) return;
    $id("phase").textContent = v.phase;
    $id("cue").textContent = v.cue || "";
    $id("say").innerHTML = `<div class="lab">${esc(v.lab)}</div><div>${esc(v.say)}</div>` + (v.ans ? `<div class="ansline">${esc(v.ans)}</div>` : "");
    $id("nx").innerHTML = "<b>" + esc(v.next) + "</b>";
    $id("go").textContent = v.go; $id("go").onclick = v.act;
    const n = Object.keys(P).length;
    $id("chips").innerHTML = `<span class="chip"><b>${n}</b> players</span>` + (S.phase==="question"||S.phase==="reveal" ? `<span class="chip"><b>${answersFor(S.q).length}</b> answered</span>` : "");
  }
  $id("back").onclick = () => { if (S.phase === "lobby" && step > 0) setStep(step-1); };
  $id("rst").onclick = async () => { if (confirm("Reset the quiz? All players and scores are deleted.")) { await resetGame(); setStep(0); } };
  listeners.push(render); render();
  setInterval(() => { if (S.phase === "question") { render(); autoReveal(); } }, 500);
}


/* ================= DEMO (solo practice, nothing sent) ================= */
function demoMode(){
  root.className = "app player";
  let i = 0, score = 0, t0 = 0, timer = null, done = false;
  const top = () => `<div class="ptop"><span><b>Practice round</b></span><span>${score} pts</span></div>`;
  function intro(){
    root.innerHTML = top() + `<div class="card join"><h1>Try the quiz</h1><p>Play the 5 questions on your own. Nothing is sent to the big screen.</p><button class="big" id="st">Start</button></div>`;
    document.getElementById("st").onclick = () => { i = 0; score = 0; ask(); };
  }
  function ask(){
    const Q = QUESTIONS[i]; t0 = Date.now(); done = false;
    root.innerHTML = top() + `<div class="card"><div class="ptimer" id="pt">Question ${i+1}</div><div class="pq"></div></div>
    <div class="btns">${Q.a.map((a,k)=>`<button class="ans c${k}"><span class="ic">${ICONS[k]}</span><span class="t"></span></button>`).join("")}</div>`;
    root.querySelector(".pq").textContent = Q.q;
    root.querySelectorAll(".ans").forEach((b,k) => { b.querySelector(".t").textContent = Q.a[k]; b.onclick = () => show(k); });
    clearInterval(timer);
    timer = setInterval(() => { const r = DUR - (Date.now()-t0)/1000; const el = document.getElementById("pt");
      if (el) el.textContent = "Question " + (i+1) + " · " + Math.max(0, Math.ceil(r)) + "s"; if (r <= 0) show(null); }, 250);
  }
  function show(k){
    if (done) return; done = true; clearInterval(timer);
    const Q = QUESTIONS[i], ok = k === Q.c, el = Math.min(1, (Date.now()-t0)/(DUR*1000));
    const g = ok ? Math.round(1000 - 500*el) : 0; score += g;
    const cls = k === null ? "none" : ok ? "good" : "bad";
    root.innerHTML = top() + `<div class="result ${cls}"><h2>${k === null ? "Too late!" : ok ? "Correct!" : "Not this time"}</h2><div class="gain">+${g}</div><p id="ex"></p><button class="big" id="nx">${i < QUESTIONS.length-1 ? "Next question" : "See my score"}</button></div>`;
    document.getElementById("ex").textContent = ok ? Q.say : "Answer: " + ICONS[Q.c] + " " + Q.a[Q.c];
    document.getElementById("nx").onclick = () => { i++; if (i < QUESTIONS.length) ask(); else end(); };
  }
  function end(){
    root.innerHTML = top() + `<div class="wait"><div class="em">🏁</div><h2>${score} points</h2><p>That's how the real quiz works. On the day, everyone plays at the same time.</p><button class="big" id="again">Play again</button></div>`;
    document.getElementById("again").onclick = () => { i = 0; score = 0; ask(); };
  }
  intro();
}

/* ================= router ================= */
if (params.has("demo")) demoMode();
else if (params.has("screen")) screenMode();
else if (params.get("remote") === REMOTE_KEY) remoteMode();
else playerMode();
</script>
